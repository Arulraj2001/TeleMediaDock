[build]
  command = "pnpm --filter @mediadock/web build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.lemonsqueezy.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://*.lemonsqueezy.com;"

[[redirects]]
  from = "/api/webhooks/lemonsqueezy"
  to = "/api/webhooks/lemonsqueezy"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
